name: Cucumber BDD Automation Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  cucumber-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Cucumber tests
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QA_EMAIL_RECIPIENT: ${{ secrets.QA_EMAIL_RECIPIENT }}
        run: mvn --batch-mode clean test

      # Generate the manager report when TestNG results exist
      - name: Generate Manager QA Report
        if: always()
        run: |
          if [ -f target/surefire-reports/testng-results.xml ]; then
            java -cp target/classes com.company.qa.reporting.ManagerReportGenerator "GitHub Actions"
          else
            echo "TestNG results file not found; manager report cannot be generated."
          fi

      # Upload the manager report
      - name: Upload Manager QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-qa-report
          path: target/manager-qa-report.html
          if-no-files-found: warn

      # Upload the Cucumber HTML report, even if tests fail
      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/cucumber.html
          if-no-files-found: warn

      # Diagnostic step: find the actual generated files
      - name: List generated test files
        if: always()
        run: |
          echo "Checking generated files under target..."
          if [ -d target ]; then
            find target -maxdepth 5 -type f | sort
          else
            echo "The target directory does not exist."
          fi

      # Upload screenshots if the expected directory contains files
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/failure-screenshots/
          if-no-files-found: warn

      # Send the result to Slack
      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Cucumber BDD Automation Tests finished.\nStatus: ${{ job.status }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Actions run>"
            }